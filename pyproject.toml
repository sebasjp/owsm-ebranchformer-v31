[project]
name = "owsm-demo"
version = "0.1.0"
description = "Inferencia y visualización de cross-attention de OWSM v3.1 (E-Branchformer)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchaudio",
    "espnet",
    "espnet_model_zoo",
    "streamlit",
    "librosa",
    "soundfile",
    "matplotlib",
    "psutil>=7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["owsm_demo"]
